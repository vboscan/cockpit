# tmux.conf — used only by `cockpit` (its own tmux server, socket name "vicks").
# Your personal ~/.tmux.conf is not read or changed.

set -g default-terminal "screen-256color"
set -as terminal-features ",*:RGB"       # pass truecolor through (Star Wars yellow)
set -g mouse on                          # wheel scrolls the shell's history, drag resizes panes
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g status off                        # the dashboard is the status bar
set -g set-titles on
set -g set-titles-string "#{pane_current_path}"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour238"
set -g pane-border-lines single

# The dashboard pane is display-only. If a click or a key combination selects it,
# hand focus straight back to the shell so typing never lands in the banner.
set-hook -g after-select-pane 'if -F "#{@vicks_dash}" "last-pane"'

# copy with the mouse: drag to select, release to copy to the macOS clipboard
set -g set-clipboard on
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
