# tmux.conf — used only by the cockpit (its own tmux server, socket name "vicks").
# Your personal ~/.tmux.conf is not read or changed. Works with tmux 3.0 and newer.

# every shell started in the cockpit knows it is inside one
set-environment -g VICKS_NO_BANNER 1
set-environment -g VICKS_IN_COCKPIT 1

# cmux tells each terminal which workspace and surface it is (CMUX_WORKSPACE_ID and
# friends). Every cockpit session takes these from the terminal that opened it; without
# this, all shells get the values of the first terminal, the one that started the server.
set -g update-environment[20] "CMUX_*"

set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*:Tc"       # pass truecolor through (Star Wars yellow)
set -g mouse on                          # wheel scrolls the shell's history, drag resizes panes
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g status off                        # the banner is the status bar
# The terminal title, which cmux shows as the workspace name in its left sidebar:
#   project                     an idle shell, e.g. "segundo" or "segundo/infra"
#   project · program           something is running, e.g. "segundo · claude"
#   ⇄ host · project            an SSH session is open in this terminal
# @vicks_proj and @vicks_ssh are set per pane by vicks.zsh (the chpwd hook and the ssh
# wrapper). Without them, e.g. in bash, the folder name is used.
set -g @vicks_home "$HOME"
set -g set-titles on
set -g set-titles-string "#{?#{@vicks_ssh},⇄ #{@vicks_ssh} · ,}#{?#{@vicks_proj},#{@vicks_proj},#{?#{==:#{pane_current_path},#{@vicks_home}},~,#{b:pane_current_path}}}#{?#{m:*sh,#{pane_current_command}},, · #{pane_current_command}}"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour238"

# cockpit.sh also sets a session-closed hook on this server: when a terminal closes,
# it makes sure the workspace still has exactly one banner, in another terminal if needed.

# The banner pane is display-only. If a click or a key combination selects it,
# hand focus straight back to the shell so typing never lands in the banner.
set-hook -g after-select-pane 'if -F "#{@vicks_dash}" "last-pane"'
# The same when a shell pane closes and tmux would leave the banner pane active:
# move on to the next shell pane.
set-hook -g pane-exited 'if -F "#{@vicks_dash}" "select-pane -t :.+"'

# copy with the mouse: drag to select, release to copy (to the macOS clipboard when there is one)
set -g set-clipboard on
if-shell 'command -v pbcopy' \
  'bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy" ; bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"'

# Cmd+K. The terminal app is told (see install.sh) to send this private key code
# instead of wiping its own buffer, which tmux would never hear about. Here it
# clears the shell pane and its scrollback, and leaves the banner pane alone.
set -s user-keys[0] "\e[5000~"
bind -n            User0 send-keys -R \; send-keys C-l \; run-shell -b "sleep 0.3; tmux clear-history -t '#{pane_id}'"
bind -T copy-mode    User0 send -X cancel \; send-keys -R \; send-keys C-l \; run-shell -b "sleep 0.3; tmux clear-history -t '#{pane_id}'"
bind -T copy-mode-vi User0 send -X cancel \; send-keys -R \; send-keys C-l \; run-shell -b "sleep 0.3; tmux clear-history -t '#{pane_id}'"
