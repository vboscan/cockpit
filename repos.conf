# repos.conf — which GitHub repos live on which machine. Read by repos.zsh.
#
#   remote <ssh-destination> <folder>   the other machine and where its clones live
#   <owner>/<repo> <where>...           where = local (this Mac, under ~/Git) and/or remote
#
# A repo that is listed gets cloned when missing, kept up to date on main, and gets a
# cmux workspace. A repo that is not listed is left alone.

remote dev@devbox-1 ~

vboscan/cockpit               local remote
vboscan/devbox                local remote
vboscan/segundo               local remote
vboscan/study                 local
vboscan/pull-apple-reminders  local
vboscan/catatumbo             remote
vboscan/Habitus               remote
vboscan/wreck-it-ralph        remote
vboscan/contract-catatumbo    remote
vboscan/cube2-server          remote
vboscan/sour-catatumbo        remote
